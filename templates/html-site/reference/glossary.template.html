<!--
  用語集ページの雛形。glossary.json を category 別にグルーピングして表示する
  (quiz_data.json / study_content.json と category の表記を揃えておくこと)。
  検索は term/aliases を対象にしたインクリメンタル検索(大文字小文字・ひらがな差を吸収するため
  data-term/data-aliases は小文字化して埋め込む)。
-->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>用語集 | {{EXAM_LABEL}} 対策</title>
<link rel="stylesheet" href="../assets/style.css" />
</head>
<body data-page="reference/glossary.html">
<header class="site-header">
  <a href="../index.html" class="logo">{{EXAM_LABEL}}<span>学習教材</span></a>
  <nav>
    <a href="../index.html">トップ</a>
    <a href="../concepts/sample-category.html">{{DOMAIN1_NAV_LABEL}}</a>
    <a href="../domain2/sample-category.html">{{DOMAIN2_NAV_LABEL}}</a>
    <a href="../reference/glossary.html" class="active">用語集</a>
    <a href="../reference/cheatsheet.html">チートシート</a>
    <a href="../mapping.html">問題&times;資料対応表</a>
    <a href="../quiz.html">学習モード</a>
  </nav>
</header>
<div class="breadcrumb"><a href="../index.html">トップ</a><span class="sep">/</span>リファレンス<span class="sep">/</span>用語集</div>
<main>

<div class="hero">
  <span class="tag">REFERENCE #1</span>
  <h1>用語集</h1>
  <p class="subtitle">試験頻出の専門用語を{{用語数}}語、出題カテゴリ別に整理</p>
</div>

<input id="glossary-search" class="glossary-search" placeholder="用語を検索...(英語表記・略称も対象)">

<div class="glossary-nav">
  <a href="#cat-0">{{カテゴリ名}}</a>
  <!-- カテゴリ数だけ繰り返す -->
</div>

<!-- カテゴリごとに1つの term-section を繰り返す -->
<div class="term-section" id="cat-0">
  <h2>{{カテゴリ名}}</h2>
  <dl class="terms">
    <!-- 用語ごとに1つの term-item を繰り返す。definitionは平均120文字以上(reference-ios.md参照) -->
    <div class="term-item" data-term="{{termを小文字化}}" data-aliases="{{aliasesを小文字化しスペース区切り}}">
      <dt>{{term}} <span style="color:var(--sub); font-weight:400; font-size:12px;">({{aliases}})</span></dt>
      <dd>{{definition}}</dd>
    </div>
  </dl>
</div>

</main>
<footer class="site-footer">
  {{EXAM_LABEL}} 学習教材 · {{出典・注意事項を一言}}。詳細は <a href="../SOURCES.md">SOURCES.md</a> を参照。
</footer>
<script src="../assets/main.js"></script>
<script>
(function(){
  const input = document.getElementById("glossary-search");
  input.addEventListener("input", () => {
    const q = input.value.trim().toLowerCase();
    document.querySelectorAll(".term-item").forEach((el) => {
      const hit = !q || el.dataset.term.includes(q) || el.dataset.aliases.includes(q);
      el.classList.toggle("is-hidden", !hit);
    });
    document.querySelectorAll(".term-section").forEach((sec) => {
      const any = sec.querySelectorAll(".term-item:not(.is-hidden)").length > 0;
      sec.style.display = any ? "" : "none";
    });
  });
})();
</script>
</body>
</html>
